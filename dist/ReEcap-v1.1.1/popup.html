<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReEcap settings</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    * { box-sizing: border-box; }

    html {
      width: min(24rem, 100vw);
      background: var(--surface-page-glow);
    }

    body {
      min-width: 20rem;
      width: min(24rem, 100vw);
      margin: 0;
      padding: var(--space-lg);
      background: var(--surface-page-glow);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.45;
    }

    button { font: inherit; }
    button:focus-visible,
    [role="radio"]:focus-visible,
    [role="switch"]:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin: 0 0 var(--space-lg);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-mark {
      display: grid;
      width: 2.5rem;
      height: 2.5rem;
      flex: 0 0 auto;
      place-items: center;
      border-radius: var(--radius-sm);
      background: var(--action-primary);
      box-shadow: var(--ambient-glow);
      color: var(--text-on-action);
      font-size: 1.25rem;
      font-weight: 750;
      letter-spacing: -0.08em;
    }

    .brand-copy { min-width: 0; }
    .brand-copy h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -0.025em;
    }

    .brand-copy p,
    .section-heading,
    .connection-copy,
    .footer-version {
      font-family: var(--font-mono);
    }

    .brand-copy p {
      margin: 0.125rem 0 0;
      color: var(--text-faint);
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .settings-panel {
      display: grid;
      gap: var(--space-lg);
      padding: var(--space-lg);
      border: var(--card-border);
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      box-shadow: var(--card-shadow);
    }

    .connection-row,
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .connection-copy { min-width: 0; }
    .connection-copy strong {
      display: block;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
    }

    .connection-copy span {
      display: block;
      margin-top: 0.125rem;
      color: var(--text-secondary);
      font-size: 0.6875rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      color: var(--status-success);
      font-size: 0.6875rem;
      font-weight: 700;
    }

    .status::before {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .status[data-state="disabled"],
    .status[data-state="unavailable"],
    .status[data-state="error"] { color: var(--text-secondary); }
    .status[data-state="error"] { color: var(--status-danger); }

    .switch {
      position: relative;
      width: 3rem;
      min-width: 3rem;
      height: 1.75rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      background: var(--surface-sunken);
      cursor: pointer;
      transition: background var(--duration-standard) var(--ease-standard), border-color var(--duration-standard) var(--ease-standard);
    }

    .switch::after {
      position: absolute;
      top: 0.1875rem;
      left: 0.1875rem;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      background: var(--text-secondary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      content: "";
      transition: transform var(--duration-standard) var(--ease-standard), background var(--duration-standard) var(--ease-standard);
    }

    .switch[aria-checked="true"] {
      border-color: var(--action-primary);
      background: var(--action-primary);
    }
    .switch[aria-checked="true"]::after {
      transform: translateX(1.25rem);
      background: var(--text-on-action);
    }

    .rule { width: 100%; height: 1px; margin: 0; border: 0; background: var(--border-subtle); }

    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .section-heading {
      margin-bottom: var(--space-sm);
      color: var(--text-faint);
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-xs);
      padding: var(--space-xs);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-sunken);
    }

    .choice {
      display: inline-flex;
      min-height: 2.5rem;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.5rem;
      border: 1px solid transparent;
      border-radius: var(--radius-xs);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      text-align: center;
      transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);
    }

    .choice:hover { background: var(--surface-hover); color: var(--text-primary); }
    .choice[aria-checked="true"] {
      border-color: var(--action-primary);
      background: var(--action-primary);
      color: var(--text-on-action);
    }

    .choice-dot {
      width: 0.5rem;
      height: 0.5rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.85;
    }

    .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mode-note {
      margin: var(--space-sm) 0 0;
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    fieldset[disabled] { opacity: 0.6; }
    fieldset[disabled] .choice { cursor: not-allowed; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-top: var(--space-md);
      color: var(--text-faint);
      font-size: 0.625rem;
    }

    .footer button {
      min-height: 2rem;
      padding: 0.25rem 0.5rem;
      border: 0;
      border-radius: var(--radius-xs);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }
    .footer button:hover { color: var(--text-primary); }

    body.is-disabled .setting-controls { opacity: 0.55; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="brand-mark" aria-hidden="true">R</div>
    <div class="brand-copy">
      <h1>ReEcap</h1>
      <p>Student workspace</p>
    </div>
  </header>

  <main class="settings-panel" aria-label="ReEcap settings">
    <section class="connection-row" aria-labelledby="themeToggleLabel">
      <div class="connection-copy">
        <strong id="themeToggleLabel">Use ReEcap on this portal</strong>
        <span id="statusText" class="status" data-state="active" role="status">Active</span>
      </div>
      <button id="toggleSwitch" class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="themeToggleLabel"></button>
    </section>

    <div class="setting-controls">
      <hr class="rule">
      <fieldset class="theme-row" style="margin-top: var(--space-lg)">
        <legend class="section-heading">Colour family</legend>
        <div id="familySwitcher" class="choice-grid" role="radiogroup" aria-label="Colour family">
          <button class="choice" type="button" data-family="original" role="radio" aria-checked="false"><span class="choice-dot"></span>Classic</button>
          <button class="choice" type="button" data-family="cappuccino" role="radio" aria-checked="false"><span class="choice-dot"></span>Cappuccino</button>
          <button class="choice" type="button" data-family="evergreen" role="radio" aria-checked="false"><span class="choice-dot"></span>Evergreen</button>
          <button class="choice" type="button" data-family="midnight" role="radio" aria-checked="false"><span class="choice-dot"></span>Midnight</button>
          <button class="choice" type="button" data-family="rosewood" role="radio" aria-checked="false"><span class="choice-dot"></span>Rosewood</button>
          <button class="choice" type="button" data-family="amoled" role="radio" aria-checked="false"><span class="choice-dot"></span>AMOLED</button>
        </div>
      </fieldset>

      <hr class="rule" style="margin-top: var(--space-lg)">
      <fieldset id="modeRow" class="theme-row" style="margin-top: var(--space-lg)">
        <legend class="section-heading">Appearance</legend>
        <div id="modeSwitcher" class="choice-grid mode-grid" role="radiogroup" aria-label="Appearance mode">
          <button class="choice" type="button" data-mode="light" role="radio" aria-checked="false">Light</button>
          <button class="choice" type="button" data-mode="dark" role="radio" aria-checked="false">Dark</button>
        </div>
        <p id="modeNote" class="mode-note" hidden>AMOLED uses a dedicated dark palette.</p>
      </fieldset>
    </div>
  </main>

  <footer class="footer">
    <span class="footer-version">v1.0.0</span>
    <button id="clearCacheButton" type="button">Clear local cache</button>
  </footer>

  <script src="shared/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
