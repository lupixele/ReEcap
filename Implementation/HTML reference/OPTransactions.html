<script language="javascript" type="text/javascript">
    $(document).ready(function() {
        setDatePicker();
        setCurrentDate("txtfrom");
        setCurrentDate("txtto");
        if ('' != null && '' != "")
            $("#trrollno").show();
        
        $("#btnshow").click(function () {
           
                showProcessDialog("divprocess", true);
                setTimeout(function() {
                    try {
                        
                        var response = Feepayments_optransactions.ShowOPTransactions("", $("#txtfrom").val(), $("#txtto").val(),$("input:radio[name=radtype]:checked").val(),$("input:radio[name=radftype]:checked").val(),$("input:radio[name=radbank]:checked").val());
                        if (response.error == null) {
                            $("#divtransactions").html(response.value);
                            $("#tbltransactions tr:gt(0):even").addClass("evenRow");
                            $("#tbltransactions tr[name=yes]").each(function () {
                                $(this).removeClass("evenRow").addClass("lightorange");
                            });
                        }
                        else Raiserror(response.error);
                    }
                    catch (e) { alert(e.error); }
                    showProcessDialog("divprocess", false);
                    ResizeIFrame();
                }, 500);
            
        });
        $("input:radio[name=radftype]").click(function () {
            if ($(this).val() == "R" || $(this).val()=="E")
                $("#trbank").hide();
            else $("#trbank").show();
            $("#divtransactions").html("");
            ResizeIFrame();
        });
    });
function onViewPrintClick(rcptno, pdate) {
    showProcessDialog("divprocess", true);
    setTimeout(function() {
        try {
            var response = Feepayments_optransactions.ViewReceipt(rcptno, pdate,"",$("input:radio[name=radftype]:checked").val());
            if (response.error == null) {
                if ($("input:radio[name=radftype]:checked").val() == "G") {
                    if (response.value == "success")
                        window.open("../printpdf.aspx");
                    else alert(response.value);
                }
                else {
                    $("#divexamreceipt").html(response.value);
                    if ($("#tblReport").length > 0)
                        PrintReport();
                }
                
            }
        }
        catch (e) { alert(e.error); }
        showProcessDialog("divprocess", false);
        ResizeIFrame();
    });

}
function onGetStatusClick(rfno,generatedbyuser,btype) {
    showProcessDialog("divprocess", true);
    setTimeout(function() {
        try {
            var response = Feepayments_optransactions.GetStatus(rfno, "", generatedbyuser, $("input:radio[name=radftype]:checked").val(), btype);
            if (response.error == null) {
                var ft = $("input:radio[name=radftype]:checked").val();
                if (ft == "G") {
                    if (response.value == "success") {
                        window.open("../printpdf.aspx");
                        $("#btnshow").trigger("click");
                    }
                    else {
                        alert(response.value);
                    }
                }
                else {
                     $("#divexamreceipt").html(response.value);
                    if ($("#tblReport").length > 0)
                        PrintReport();
                    else alert(response.value);
                }
            }
            else alert(response.error);
        }
        catch (e) { alert(e.error); }
        showProcessDialog("divprocess", false);
    }, 500);
}
</script>
