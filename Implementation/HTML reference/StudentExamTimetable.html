    <script language="javascript" type="text/javascript">
        $(document).ready(function () {
            $("#divaccordian").accordion({ collapsible: true, active: false, clearStyle: true, autoHeight: false });

                    ResizeIFrame();

                url: "studentexamtimetable.aspx/ShowStudentData",
                data: {},
                success: function (res) {
                    if (res != "-1000")
                    {
                        const tabledata = `<table width="100%" cellpadding="2" cellspacing="0" class="popupTable" id="tblexamtimetable">

                                            <tr>
                                                <td align="center">${item.doe}</td>
                                                <td align="center">${item.examtime}</td>
                                                <td align="center">${item.examid == 1 ? "External" : item.examname}</td>
                                                <td align="center">${item.subjectcode}</td>
                                                <td align="left">${item.subjectname}</td>
                                            </tr>
                                            `).join('')}
                                            </tbody>
                                            </table>`
                        $("#divtimetable").html(tabledata);
                        $("#tblexamtimetable tr:gt(0):even").addClass("evenRow");
                    }

                }
            })
        })
